name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: 11
          cache: true
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: pnpm install
      - run: pnpm lint
